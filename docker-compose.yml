services:
  # PostgreSQL Database
  database:
    image: postgres:16-alpine
    container_name: chattt-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-chattt}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - chattt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-chattt}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS API
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-dev}
    container_name: chattt-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-chattt}
      - JWT_SECRET=${JWT_SECRET:-changeme}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - SMTP_HOST=${SMTP_HOST:-mailhog}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-noreply@chattt.local}
    volumes:
      - ./api:/app
      - /app/node_modules
    networks:
      - chattt-network
    depends_on:
      database:
        condition: service_healthy
    command: npm run start:dev

  # Next.js Frontend
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-dev}
    container_name: chattt-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    volumes:
      - ./front:/app
      - /app/node_modules
      - /app/.next
    networks:
      - chattt-network
    depends_on:
      - api
    command: npm run dev

  # Redis (Optional - for caching and sessions)
  redis:
    image: redis:7-alpine
    container_name: chattt-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - chattt-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mailhog (Local email testing)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: chattt-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"  # SMTP port
      - "${MAILHOG_WEB_PORT:-8025}:8025"   # Web UI port
    networks:
      - chattt-network

  # Database Migration and Seeding (One-shot service)
  migrations:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: dev
    container_name: chattt-migrations
    environment:
      - NODE_ENV=development
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-chattt}
    volumes:
      - ./api:/app
      - /app/node_modules
    networks:
      - chattt-network
    depends_on:
      database:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Waiting for database to be ready...' &&
        sleep 5 &&
        echo 'Running database reset and seed...' &&
        npm run db:reset &&
        npm run db:seed &&
        echo 'Database setup complete!'
      "
    restart: "no"

networks:
  chattt-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
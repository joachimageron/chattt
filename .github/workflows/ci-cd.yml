name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Test and validate the setup
  validate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create .env file
      run: cp .env.example .env

    - name: Validate Docker Compose configuration
      run: |
        docker compose config
        docker compose -f docker-compose.yml -f docker-compose.prod.yml config

    - name: Run validation script
      run: ./scripts/validate-setup.sh

  # Build and test API
  test-api:
    runs-on: ubuntu-latest
    needs: validate
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: chattt_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: api/package-lock.json

    - name: Install API dependencies
      working-directory: ./api
      run: npm ci

    - name: Build API
      working-directory: ./api
      run: npm run build

    - name: Run API tests
      working-directory: ./api
      run: npm test
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USERNAME: postgres
        DB_PASSWORD: postgres
        DB_NAME: chattt_test
        NODE_ENV: test

  # Build and test Frontend
  test-frontend:
    runs-on: ubuntu-latest
    needs: validate
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: front/package-lock.json

    - name: Install Frontend dependencies
      working-directory: ./front
      run: npm ci

    # Note: Skipping build due to HeroUI compatibility issue
    # This should be re-enabled once the issue is resolved
    # - name: Build Frontend
    #   working-directory: ./front
    #   run: npm run build

    - name: Run Frontend linting
      working-directory: ./front
      run: npm run lint

  # Build Docker images
  build-docker:
    runs-on: ubuntu-latest
    needs: [test-api, test-frontend]
    if: github.event_name == 'push'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Create .env file
      run: cp .env.example .env

    - name: Build development images
      run: |
        docker compose build --parallel

    - name: Build production images
      run: |
        docker compose -f docker-compose.yml -f docker-compose.prod.yml build --parallel

    - name: Test Docker setup
      run: |
        # Start services
        docker compose up -d database redis
        
        # Wait for database
        sleep 10
        
        # Test database connection
        docker compose exec -T database pg_isready -U postgres -d chattt
        
        # Cleanup
        docker compose down -v

  # Optional: Deploy to staging/production
